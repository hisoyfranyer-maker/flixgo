<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080b14">
<title>FLIXGO</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080b14;color:white;
 font-family:Arial,sans-serif;
}
header{
 padding:22px 18px;display:flex;
 justify-content:space-between;align-items:center;
}
.logo{font-size:29px;font-weight:900}
.logo span{color:#168cff}
button{
 border:0;border-radius:12px;padding:12px 17px;
 background:#147cff;color:white;font-weight:bold;
}
.search{padding:0 18px}
input{
 width:100%;padding:15px;border-radius:12px;
 border:1px solid #28354b;background:#151d2c;
 color:white;font-size:16px;
}
.hero{
 margin:20px 18px;padding:25px 20px;
 min-height:205px;border-radius:20px;
 background:linear-gradient(120deg,#102e5b,#080b14);
 display:flex;flex-direction:column;
 justify-content:center;
}
.hero h1{font-size:30px;margin:8px 0}
.hero p{color:#b5c5df}
section{padding:10px 18px}
h2{font-size:20px}
.categories{display:flex;gap:9px;overflow:auto}
.categories button{white-space:nowrap}
.movies{
 display:grid;grid-template-columns:1fr 1fr;
 gap:14px;
}
.movie{
 background:#151d2c;border-radius:14px;
 overflow:hidden;
}
.poster{
 height:145px;display:flex;align-items:center;
 justify-content:center;font-size:42px;
 background:linear-gradient(140deg,#123e78,#101827);
}
.movie h3{font-size:15px;margin:10px}
.movie p{color:#9aabc3;font-size:12px;margin:0 10px 12px}
footer{
 padding:22px;text-align:center;color:#8190a8;
}
</style>
</head>
<body>

<header>
 <div class="logo">FLIX<span>GO</span></div>
 <button onclick="alert('Próximamente: tu perfil')">Mi perfil</button>
</header>

<div class="search">
 <input id="search" placeholder="Buscar películas..."
 oninput="filterMovies()">
</div>

<div class="hero">
 <small style="color:#49a4ff">BIENVENIDO A FLIXGO</small>
 <h1>Tu entretenimiento comienza aquí.</h1>
 <p>Descubre películas y disfruta de nuevas historias.</p>
</div>

<section>
 <h2>Categorías</h2>
 <div class="categories">
  <button onclick="showCategory('Todas')">Todas</button>
  <button onclick="showCategory('Acción')">Acción</button>
  <button onclick="showCategory('Aventura')">Aventura</button>
  <button onclick="showCategory('Drama')">Drama</button>
 </div>
</section>

<section>
 <h2>Catálogo de películas</h2>
 <div class="movies" id="movies"></div>
</section>

<footer>
 FLIXGO © 2026 · Tu mundo de entretenimiento
</footer>

<script>
const films=[
 {name:"La última misión",category:"Acción",emoji:"🚀"},
 {name:"Mundos perdidos",category:"Aventura",emoji:"🌎"},
 {name:"Destino final",category:"Drama",emoji:"🎭"},
 {name:"Zona espacial",category:"Acción",emoji:"🌌"}
];

function render(list){
 document.getElementById("movies").innerHTML=
 list.map(f=>`
 <div class="movie">
 <div class="poster">${f.emoji}</div>
 <h3>${f.name}</h3>
 <p>${f.category} · Próximamente</p>
 </div>`).join("");
}
function filterMovies(){
 const q=document.getElementById("search").value.toLowerCase();
 render(films.filter(f=>f.name.toLowerCase().includes(q)));
}
function showCategory(cat){
 render(cat==="Todas"?films:films.filter(f=>f.category===cat));
}
render(films);
</script>

</body>
  </html>
